# Camera bridge configuration for Gazebo to ROS2
# Place this file in: gantry/config/camera_bridge.yaml

# RGB-D Camera Topics (default)
- ros_topic_name: "gantry_camera/color/image_raw"
  gz_topic_name: "gantry_camera/color/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "gantry_camera/color/camera_info"
  gz_topic_name: "gantry_camera/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "gantry_camera/depth/image_raw"
  gz_topic_name: "gantry_camera/depth/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "gantry_camera/depth/camera_info"
  gz_topic_name: "gantry_camera/depth/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "gantry_camera/depth/points"
  gz_topic_name: "gantry_camera/depth/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# Overhead Camera (if enabled)
- ros_topic_name: "overhead_camera/image_raw"
  gz_topic_name: "overhead_camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "overhead_camera/camera_info"
  gz_topic_name: "overhead_camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS